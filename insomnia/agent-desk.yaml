type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: agent-desk
meta:
  id: wrk_faf09e4c34b148c0b55da65ffb8ec8ae
  created: 1795812074306
  modified: 1795812074306
  description: API de gestão do agent-desk. Escolha o ambiente **Local** e
    preencha `admin_token` com o `ADMIN_TOKEN` do seu `.env`.
collection:
  - name: Health
    meta:
      id: fld_859f4361f16f4fcf911a31c85c5a03cd
      created: 1795812074309
      modified: 1795812074309
      sortKey: -200
      description: Rota pública, sem token.
    children:
      - url: "{{ _.base_url }}/health"
        name: Health check
        meta:
          id: req_4fa5b995921043bf972ed12dc7c3c2c7
          created: 1795812074309
          modified: 1795812078069
          isPrivate: false
          description: "Pública (`@Public()`). Esperado: `200` com `status: ok` e banco e
            Redis `up`."
          sortKey: -100
        method: GET
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
  - name: Conexões de canal
    meta:
      id: fld_bea67c1c578147b482d531135297968e
      created: 1795812074310
      modified: 1795812074310
      sortKey: -100
      description: "`ChannelConnection` (M1.1). Toda rota exige o header `x-admin-token`."
    children:
      - url: "{{ _.base_url }}/channel-connections/evolution"
        name: Registrar conexão Evolution
        meta:
          id: req_91926a1b3df94549a7fcd89a068c9c28
          created: 1795812074310
          modified: 1795812074310
          isPrivate: false
          description: "Esperado: `201` com `id`, `channel: whatsapp`, `connector:
            evolution` e `connectorSettings`. A `apiKey` **não** aparece na
            resposta. O `webhookToken` aparece só nesta resposta."
          sortKey: -400
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "baseUrl": "{{ _.evolution_base_url }}",
              "instanceName": "{{ _.evolution_instance_name }}",
              "apiKey": "{{ _.evolution_api_key }}"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: x-admin-token
            value: "{{ _.admin_token }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/channel-connections/evolution"
        name: Registrar com token errado (401)
        meta:
          id: req_5de32f6699844e9497858ec891993ac0
          created: 1795812074311
          modified: 1795812074311
          isPrivate: false
          description: 'Esperado: `401` `{"message":"Unauthorized","statusCode":401}`.'
          sortKey: -200
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "baseUrl": "{{ _.evolution_base_url }}",
              "instanceName": "{{ _.evolution_instance_name }}",
              "apiKey": "{{ _.evolution_api_key }}"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: x-admin-token
            value: token-errado
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/channel-connections/evolution"
        name: Registrar sem token (401)
        meta:
          id: req_878d50179c324152a15431214a5281e6
          created: 1795812074311
          modified: 1795812074311
          isPrivate: false
          description: 'Esperado: `401` `{"message":"Unauthorized","statusCode":401}`.'
          sortKey: -300
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "baseUrl": "{{ _.evolution_base_url }}",
              "instanceName": "{{ _.evolution_instance_name }}",
              "apiKey": "{{ _.evolution_api_key }}"
            }
        headers:
          - name: Content-Type
            value: application/json
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/channel-connections/evolution"
        name: Registrar com corpo inválido (400)
        meta:
          id: req_450aa17a455d410b9d41b537b3032dcd
          created: 1795812074312
          modified: 1795812074312
          isPrivate: false
          description: "Esperado: `400` no formato do `ValidationPipe`, com a lista de
            problemas em `message` (`baseUrl must be a URL address`, `apiKey
            should not be empty`). O campo `extra` é descartado em silêncio, sem
            erro (veja o débito técnico em `tech-docs/code/api.md`)."
          sortKey: -100
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "baseUrl": "nao-e-url",
              "instanceName": "{{ _.evolution_instance_name }}",
              "extra": 1
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: x-admin-token
            value: "{{ _.admin_token }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
  - name: Webhooks
    meta:
      id: fld_2c1d0f6a7b8e4f3a9d5c6e7f8a9b0c1d
      created: 1795812074313
      modified: 1795812074313
      sortKey: 0
      description: Entrada do provedor (M1.2). Usa o `x-webhook-token` da conexão, não
        o token de administração.
    children:
      - url: "{{ _.base_url }}/webhooks/evolution/{{ _.connection_id }}"
        name: Receber mensagem (Evolution)
        meta:
          id: req_3e4f5a6b7c8d4e9f8a1b2c3d4e5f6a7b
          created: 1795812074313
          modified: 1795812074313
          isPrivate: false
          description: "Esperado: `200` sem corpo. O servidor registra `channel inbound
            received` com `kind: contact_message`. Cole em `connection_id` e
            `webhook_token` o `id` e o `webhookToken` da resposta do registro.
            Sem o header, ou com token errado: `401`."
          sortKey: -100
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "event": "messages.upsert",
              "instance": "store",
              "data": {
                "key": {
                  "remoteJid": "100000000000001@lid",
                  "fromMe": false,
                  "id": "TESTMSG00000001",
                  "remoteJidAlt": "5511900000001@s.whatsapp.net",
                  "addressingMode": "lid",
                  "participant": ""
                },
                "pushName": "Contato Teste",
                "message": {
                  "conversation": "Oi, vocês têm esse produto?"
                },
                "messageType": "conversation",
                "messageTimestamp": 1795800000,
                "instanceId": "00000000-0000-4000-8000-000000000001",
                "source": "android"
              },
              "destination": "https://agent-desk.example/webhooks/evolution",
              "date_time": "2026-11-27T12:00:00.000Z",
              "sender": "5511900000000@s.whatsapp.net",
              "server_url": "https://evolution.example",
              "apikey": "fake-instance-api-key"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: x-webhook-token
            value: "{{ _.webhook_token }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
