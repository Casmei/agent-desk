services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agent_desk
      POSTGRES_PASSWORD: agent_desk
      POSTGRES_DB: agent_desk
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent_desk -d agent_desk']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
